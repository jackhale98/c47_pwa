events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 10M;
    
    # Gzip compression for GTK assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml
        application/x-font-ttf
        font/opentype;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # CSP allowing Broadway WebSocket connections
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws://localhost:8080 wss://localhost:8080 http://localhost:8080; frame-src 'self' http://localhost:8080;" always;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=broadway:10m rate=50r/s;
    
    # Upstream for Broadway backend
    upstream broadway_backend {
        server c47-broadway:8080;
        keepalive 32;
    }
    
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        
        # Redirect all HTTP to HTTPS in production
        # Uncomment for production:
        # return 301 https://$host$request_uri;
        
        root /usr/share/nginx/html;
        index index.html;
        
        # PWA static files
        location / {
            try_files $uri $uri/ /index.html;
            
            # PWA caching headers
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
            
            # Service worker - no cache
            location = /sw.js {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                expires 0;
            }
            
            # Manifest
            location = /manifest.json {
                add_header Cache-Control "public, max-age=604800";
            }
        }
        
        # GTK assets
        location /assets/gtk/ {
            alias /usr/share/nginx/html/assets/gtk/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
            
            # Serve .glade files as XML
            location ~* \.glade$ {
                add_header Content-Type "application/xml";
            }
            
            # Font files
            location ~* \.(ttf|otf|woff|woff2)$ {
                add_header Access-Control-Allow-Origin "*";
            }
        }
        
        # Broadway proxy (development mode - direct to port 8080)
        location /broadway/ {
            # Rate limiting for Broadway
            limit_req zone=broadway burst=20 nodelay;
            
            # WebSocket support
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            # Standard proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Broadway specific
            proxy_pass http://localhost:8080/;
            proxy_redirect off;
            
            # Timeouts for long-lived connections
            proxy_connect_timeout 90;
            proxy_send_timeout 90;
            proxy_read_timeout 90;
            
            # WebSocket timeouts
            proxy_buffering off;
            proxy_cache off;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }
        
        # API endpoints (future use)
        location /api/ {
            limit_req zone=general burst=5 nodelay;
            
            # CORS headers for API
            add_header Access-Control-Allow-Origin "$http_origin" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            
            if ($request_method = OPTIONS) {
                return 204;
            }
            
            # Proxy to backend API (when implemented)
            # proxy_pass http://api_backend/;
            
            # For now, return 501 Not Implemented
            return 501;
        }
    }
    
    # HTTPS server configuration (for production)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name c47calculator.com www.c47calculator.com;
        
        # SSL configuration (update paths for your certificates)
        ssl_certificate /etc/ssl/certs/fullchain.pem;
        ssl_certificate_key /etc/ssl/certs/privkey.pem;
        
        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_stapling on;
        ssl_stapling_verify on;
        
        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        root /usr/share/nginx/html;
        index index.html;
        
        # Same location blocks as HTTP server
        location / {
            try_files $uri $uri/ /index.html;
            
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                access_log off;
            }
            
            location = /sw.js {
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                expires 0;
            }
            
            location = /manifest.json {
                add_header Cache-Control "public, max-age=604800";
            }
        }
        
        location /assets/gtk/ {
            alias /usr/share/nginx/html/assets/gtk/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        # Broadway proxy for production
        location /broadway/ {
            limit_req zone=broadway burst=20 nodelay;
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_pass http://broadway_backend/;
            proxy_redirect off;
            
            proxy_connect_timeout 90;
            proxy_send_timeout 90;
            proxy_read_timeout 90;
            proxy_buffering off;
            proxy_cache off;
        }
        
        location /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }
    }
}