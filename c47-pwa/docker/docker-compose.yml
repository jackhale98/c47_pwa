version: '3.8'

services:
  c47-broadway:
    build: 
      context: ..
      dockerfile: docker/Dockerfile.broadway
    image: c47-pwa-backend:latest
    container_name: c47-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DISPLAY=:99
      - GDK_BACKEND=broadway
      - BROADWAY_DISPLAY=:5
      - GTK_THEME=Adwaita
    volumes:
      - ../public/assets/gtk:/app/assets:ro
      - calculator-data:/app/data
    networks:
      - c47-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  c47-frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    image: c47-pwa-frontend:latest
    container_name: c47-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../public:/usr/share/nginx/html:ro
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ssl-certs:/etc/ssl/certs:ro
    depends_on:
      c47-broadway:
        condition: service_healthy
    networks:
      - c47-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  calculator-data:
    driver: local
  ssl-certs:
    driver: local

networks:
  c47-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16