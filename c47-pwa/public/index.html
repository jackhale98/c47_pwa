<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>C47 Scientific Calculator</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/gtk/icons/calculator.png">
    <meta name="theme-color" content="#2c3e50">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="C47 Calc">
    <link rel="apple-touch-icon" href="assets/gtk/icons/calculator-192.png">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #1a1a1a;
            overflow: hidden;
            font-family: system-ui, -apple-system, sans-serif;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        
        .app-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1a1a1a;
        }
        
        .calculator-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 800px;
            aspect-ratio: 0.6;
            margin: 0 auto;
            background: #2c2c2c;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        @media (orientation: landscape) {
            .calculator-wrapper {
                max-width: 800px;
                max-height: 480px;
                aspect-ratio: 1.67;
            }
        }
        
        .gtk-broadway-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            background: white;
            transform-origin: top left;
        }
        
        .loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        
        .loading-overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .calculator-icon {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .loading-text {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: 500;
        }
        
        .loading-subtext {
            font-size: 14px;
            opacity: 0.8;
        }
        
        .loading-spinner {
            margin-top: 20px;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .error-message {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            z-index: 2000;
        }
        
        .error-message h2 {
            color: #e74c3c;
            margin-bottom: 15px;
        }
        
        .error-message p {
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        .error-message button {
            background: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        
        .error-message button:hover {
            background: #2980b9;
        }
        
        @media (max-width: 768px) {
            .gtk-broadway-frame {
                transform: scale(1);
                transform-origin: top left;
                width: 100vw;
                height: 100vh;
            }
        }
        
        @media (max-width: 480px) and (orientation: portrait) {
            .gtk-broadway-frame {
                transform: scale(0.95);
                transform-origin: center;
            }
        }
        
        @media (max-width: 812px) and (orientation: landscape) {
            .gtk-broadway-frame {
                transform: scale(0.9);
                transform-origin: center;
            }
        }
        
        .gtk-broadway-frame {
            touch-action: manipulation;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        @supports (padding: env(safe-area-inset-top)) {
            .app-container {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
                padding-left: env(safe-area-inset-left);
                padding-right: env(safe-area-inset-right);
            }
        }
        
        .install-prompt {
            display: none;
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.9);
            color: white;
            padding: 12px 20px;
            border-radius: 24px;
            font-size: 14px;
            z-index: 999;
            animation: slideUp 0.5s ease;
        }
        
        @keyframes slideUp {
            from {
                transform: translateX(-50%) translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
        
        .install-prompt button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            margin-left: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div id="loading" class="loading-overlay">
            <img src="assets/gtk/icons/calculator.png" alt="C47" class="calculator-icon" onerror="this.style.display='none'">
            <div class="loading-text">C47 Scientific Calculator</div>
            <div class="loading-subtext">Loading GTK interface...</div>
            <div class="loading-spinner"></div>
        </div>
        
        <div class="calculator-wrapper">
            <iframe 
                id="gtk-frame"
                class="gtk-broadway-frame"
                src="http://172.30.144.96:8080"
                title="C47 Calculator - GTK Interface"
                sandbox="allow-same-origin allow-scripts allow-forms allow-pointer-lock">
            </iframe>
        </div>
        
        <div id="error-message" class="error-message">
            <h2>Connection Error</h2>
            <p>Unable to connect to the C47 Calculator backend. Please ensure the Broadway server is running.</p>
            <button onclick="location.reload()">Retry</button>
        </div>
        
        <div id="install-prompt" class="install-prompt">
            Install C47 Calculator for offline use
            <button id="install-btn">Install</button>
        </div>
    </div>
    
    <script>
        let deferredPrompt;
        let connectionAttempts = 0;
        const maxAttempts = 3;
        
        function hideLoading() {
            setTimeout(() => {
                document.getElementById('loading').classList.add('hidden');
            }, 500);
        }
        
        function showError() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error-message').style.display = 'block';
        }
        
        const gtkFrame = document.getElementById('gtk-frame');
        
        gtkFrame.addEventListener('load', function() {
            hideLoading();
            connectionAttempts = 0;
        });
        
        gtkFrame.addEventListener('error', function() {
            connectionAttempts++;
            console.error(`GTK Broadway connection attempt ${connectionAttempts} failed`);
            
            if (connectionAttempts >= maxAttempts) {
                showError();
            } else {
                setTimeout(() => {
                    gtkFrame.src = gtkFrame.src;
                }, 2000 * connectionAttempts);
            }
        });
        
        setTimeout(() => {
            if (!document.getElementById('loading').classList.contains('hidden')) {
                console.warn('Load timeout - checking connection');
                fetch('http://localhost:8080', { mode: 'no-cors' })
                    .catch(() => {
                        showError();
                    });
            }
        }, 10000);
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            const installPrompt = document.getElementById('install-prompt');
            installPrompt.style.display = 'block';
            
            setTimeout(() => {
                installPrompt.style.display = 'none';
            }, 10000);
        });
        
        document.getElementById('install-btn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`Install prompt outcome: ${outcome}`);
                deferredPrompt = null;
                document.getElementById('install-prompt').style.display = 'none';
            }
        });
        
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('Service Worker registered'))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
        
        window.addEventListener('appinstalled', (evt) => {
            console.log('C47 PWA installed');
            document.getElementById('install-prompt').style.display = 'none';
        });
        
        document.addEventListener('gesturestart', function (e) {
            e.preventDefault();
        });
        
        document.addEventListener('gesturechange', function (e) {
            e.preventDefault();
        });
        
        document.addEventListener('gestureend', function (e) {
            e.preventDefault();
        });
        
        window.addEventListener('orientationchange', function() {
            setTimeout(() => {
                const frame = document.getElementById('gtk-frame');
                frame.style.height = window.innerHeight + 'px';
            }, 100);
        });
        
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault();
            }
            lastTouchEnd = now;
        }, false);
        
        if (/iPad|iPhone|iPod/.test(navigator.userAgent)) {
            document.body.style.paddingTop = 'env(safe-area-inset-top)';
            document.body.style.paddingBottom = 'env(safe-area-inset-bottom)';
            
            if (window.navigator.standalone === false) {
                setTimeout(() => {
                    const iosHint = document.createElement('div');
                    iosHint.style.cssText = `
                        position: fixed;
                        bottom: 20px;
                        left: 20px;
                        right: 20px;
                        background: rgba(0,0,0,0.9);
                        color: white;
                        padding: 12px;
                        border-radius: 8px;
                        font-size: 13px;
                        z-index: 999;
                        text-align: center;
                    `;
                    iosHint.innerHTML = `
                        📱 Add to Home Screen: Tap 
                        <span style="border: 1px solid white; padding: 2px 6px; border-radius: 3px;">Share</span> 
                        then "Add to Home Screen"
                        <button onclick="this.parentElement.remove()" 
                                style="float: right; background: none; border: none; color: white; font-size: 16px;">×</button>
                    `;
                    document.body.appendChild(iosHint);
                    
                    setTimeout(() => {
                        if (iosHint.parentElement) {
                            iosHint.remove();
                        }
                    }, 8000);
                }, 3000);
            }
        }
    </script>
</body>
</html>
